# =============================================================================
# OpenMetadata Dependencies Helm Values
# Chart: open-metadata/openmetadata-dependencies
# Version: 2.0.0
# Inclut: MySQL, OpenSearch, Airflow 3
# =============================================================================

# -- Permet l'utilisation d'images héritées (bitnamilegacy/mysql)
global:
  security:
    allowInsecureImages: true

# =============================================================================
# MySQL
# =============================================================================
mysql:
  enabled: true
  fullnameOverride: "mysql"
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnamilegacy/mysql
    tag: 8.0.37-debian-12-r2
    pullPolicy: Always
  auth:
    rootPassword: ""  # Défini via secret
    database: openmetadata_db
    username: openmetadata_user
    existingSecret: mysql-secrets
  primary:
    extraFlags: "--sort_buffer_size=20M"
    persistence:
      enabled: true
      size: 5Gi
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
  initdbScripts:
    init_openmetadata_db_scripts.sql: |
      CREATE DATABASE IF NOT EXISTS openmetadata_db;
      CREATE USER IF NOT EXISTS 'openmetadata_user'@'%' IDENTIFIED BY 'openmetadata_password';
      GRANT ALL PRIVILEGES ON openmetadata_db.* TO 'openmetadata_user'@'%' WITH GRANT OPTION;
      FLUSH PRIVILEGES;

# =============================================================================
# OpenSearch
# =============================================================================
opensearch:
  # DESACTIVE: OpenSearch (3.1.0 et 3.3.2) NPE sur les queries OM 2.0
  # (script_score wrappant multi_match dans dis_max -> DisiWrapper NPE).
  # Moteur remplace par Elasticsearch 8.x (k8s/elasticsearch.yaml), seul
  # moteur qui execute correctement les queries OM.
  enabled: false
  nodeGroup: ""
  replicas: 1
  minimumMasterNodes: 1
  singleNode: true
  opensearchJavaOpts: "-Xmx1g -Xms1g"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce
  protocol: http
  config:
    opensearch.yml: |
      plugins.security.disabled: true
      discovery.type: single-node
      indices.query.bool.max_clause_count: 4096
  extraEnvs:
    - name: DISABLE_SECURITY_PLUGIN
      value: "true"

# =============================================================================
# Airflow 3
# =============================================================================
airflow:
  enabled: true

  # -- Fernet key (doit être défini à l'install, pas à l'upgrade)
  fernetKey: "jJ/9sz0g0OHxsfxOoSfdFdmk3ysNmPRnH3TUAbz3IHA="

  # -- Flask secret key pour Airflow 3+ (ancien webserverSecretKey)
  apiSecretKey: "a5f8c3e2d1b9a7f6e4c3b2a1f9e8d7c6b5a4f3e2d1c9b8a7f6e5d4c3b2a1f0e9"

  # -- JWT secret key pour Airflow 3+
  jwtSecret: "a5f8c3e2d1b9a7f6e4c3b2a1f9e8d7c6b5a4f3e2d1c9b8a7f6e5d4c3b2a1f0e9"

  # -- Image d'ingestion OpenMetadata (Airflow 3)
  images:
    airflow:
      repository: docker.getcollate.io/openmetadata/ingestion
      tag: "2.0.0"
      pullPolicy: Always

  # -- LocalExecutor car le stockage local-path ne supporte pas RWX
  executor: "LocalExecutor"

  env:
    # Airflow 3 API auth backends (nécessaire pour que l'UI OM récupère le statut des DAGs)
    - name: AIRFLOW__API__AUTH_BACKENDS
      value: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    # Workaround Airflow 3 + MySQL : downgrade FAB provider
    - name: _PIP_ADDITIONAL_REQUIREMENTS
      value: "apache-airflow-providers-fab==2.4.4"
    # Force LocalExecutor (override airflow.cfg)
    - name: AIRFLOW__CORE__EXECUTOR
      value: "LocalExecutor"

  # -- Création de l'admin Airflow (utilisé par OpenMetadata pour l'auth pipeline)
  createUserJob:
    useHelmHooks: false
    defaultUser:
      username: admin
      password: admin
      role: Admin
      email: admin@openmetadata.org
      firstName: Admin
      lastName: User

  # -- Migration Airflow (désactivation des hooks pour ArgoCD)
  migrateDatabaseJob:
    useHelmHooks: false

  # -- Désactivation des attentes de migration sur tous les composants
  apiServer:
    waitForMigrations:
      enabled: false
    extraInitContainers: []
    startupProbe:
      timeoutSeconds: 60
      failureThreshold: 30
      periodSeconds: 10
    livenessProbe:
      timeoutSeconds: 60
      failureThreshold: 5
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi

  scheduler:
    waitForMigrations:
      enabled: false
    extraInitContainers: []
    startupProbe:
      timeoutSeconds: 60
      failureThreshold: 30
      periodSeconds: 10
    livenessProbe:
      timeoutSeconds: 60
      failureThreshold: 5
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi

  triggerer:
    waitForMigrations:
      enabled: false
    extraInitContainers: []
    livenessProbe:
      timeoutSeconds: 60
      failureThreshold: 5
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  # -- Pas de dagProcessor en LocalExecutor
  dagProcessor:
    enabled: false

  # -- Pas de Flower ni Redis avec LocalExecutor
  flower:
    enabled: false
  redis:
    enabled: false

  # -- PostgreSQL interne pour la metadata DB d'Airflow 3
  postgresql:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 16.1.0-debian-11-r20
    auth:
      enablePostgresUser: true
      postgresPassword: postgres
      database: airflow

  # -- Connexion metadata Airflow vers PostgreSQL interne
  data:
    metadataConnection:
      user: postgres
      pass: postgres
      protocol: postgresql
      host: openmetadata-dependencies-postgresql
      port: 5432
      db: airflow
      sslmode: disable

  # -- PVC partagé pour les DAGs (déjà créé par k8s/pvc-airflow-dags.yaml)
  dags:
    persistence:
      enabled: true
      existingClaim: openmetadata-dependencies-dags

  logs:
    persistence:
      enabled: false
      size: 1Gi

  ingress:
    apiServer:
      enabled: true
      ingressClassName: traefik
      annotations: {}
      path: /
      pathType: Prefix
      hosts:
        - name: airflow.192.168.11.150.nip.io
          tls:
            enabled: false
        - name: airflow.local
          tls:
            enabled: false
