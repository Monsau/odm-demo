# =============================================================================
# DEMO - Secrets Kubernetes pour OpenMetadata
# ATTENTION: Pour une démo uniquement. Ne pas utiliser en production.
# =============================================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: openmetadata
type: Opaque
stringData:
  mysql-root-password: "openmetadata_password"
  mysql-password: "openmetadata_password"
  openmetadata-mysql-password: "openmetadata_password"

---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: openmetadata
type: Opaque
stringData:
  openmetadata-airflow-password: "admin"

---
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-secrets
  namespace: openmetadata
type: Opaque
stringData:
  openmetadata-elasticsearch-password: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: oidc-secrets
  namespace: openmetadata
type: Opaque
stringData:
  openmetadata-oidc-client-id: "openmetadata"
  openmetadata-oidc-client-secret: "cUc5jhWRPWKpKZR8LoV8ZABuULwdLODD"

---
apiVersion: v1
kind: Secret
metadata:
  name: jena-secrets
  namespace: openmetadata
type: Opaque
stringData:
  # Mot de passe admin Jena Fuseki (doit correspondre à ADMIN_PASSWORD dans arcaq-k8s)
  openmetadata-jena-password: "admin"

---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: openmetadata
type: Opaque
stringData:
  # Même valeur que openmetadata-oidc-client-secret ci-dessus
  OAUTH2_PROXY_CLIENT_SECRET: "cUc5jhWRPWKpKZR8LoV8ZABuULwdLODD"
  # Cookie secret 16 octets base64url — généré pour la démo
  OAUTH2_PROXY_COOKIE_SECRET: "7b-IRcqfypmD9UBvSIFDcg=="

# fernet-key et broker-url sont gérés par le chart Helm openmetadata-dependencies (PreSync hooks)
# Ne pas les déclarer ici pour éviter le SharedResourceWarning ArgoCD
